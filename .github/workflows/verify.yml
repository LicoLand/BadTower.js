name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the published licoarc-client 0.2.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 install licoarc-client --version 0.2.0 --locked \
            --root "$RUNNER_TEMP/licoarc"
      - name: Run two-endpoint interop against a local Station
        env:
          LICOARC_CLIENT: ${{ runner.temp }}/licoarc/bin/licoarc-client
        run: node scripts/interop.mjs
