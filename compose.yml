services:
  badtower:
    build: .
    image: badtower-station:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TMPDIR: /tmp
      HOME: /tmp/home
    ports:
      - "${LISTEN:-127.0.0.1:8787}:8787"
    tmpfs:
      - /tmp
      - /app/node_modules/.mf
    volumes:
      - badtower-state:/app/data
      - ./secrets/.dev.vars:/run/badtower/.dev.vars:ro
      - ./secrets/server.key:/run/badtower/server.key:ro
      - ./secrets/server.crt:/run/badtower/server.crt:ro
      - ./secrets/ca.crt:/run/badtower/ca.crt:ro
volumes:
  badtower-state:
